<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia N95 VLC Player - Dev.Assamoi</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00f0ff">
</head>
<body>

    <div class="signature">DESIGNED BY DEV.ASSAMOI</div>

    <div class="nokia-phone">
        <!-- Touches multimédias lumineuses bleues à gauche -->
        <div class="left-media-keys">
            <button class="nokia-btn" id="btn-prev" title="Précédent" onclick="playPrevious()">⏮</button>
            <button class="nokia-btn" id="btn-play" title="Lecture / Pause">⏯</button>
            <button class="nokia-btn" id="btn-stop" title="Arrêt">⏹</button>
            <button class="nokia-btn" id="btn-next" title="Suivant" onclick="playNext()">⏭</button>
        </div>

        <!-- Écran principal -->
        <div class="nokia-screen-container">
            <div class="screen-header">
                <span id="screen-title">Nokia N95 - Menu</span>
                <span>📶 100% 🔋</span>
            </div>
            
            <div class="screen-body">
                <!-- Menu d'accueil -->
                <div class="menu-grid" id="home-menu">
                    <div class="menu-icon" onclick="openPlayer()">
                        <span style="font-size:24px;">📀</span>
                        <span>VLC Player</span>
                    </div>
                    <div class="menu-icon" onclick="openMediaList()">
                        <span style="font-size:24px;">🎬</span>
                        <span>Vidéos / Music</span>
                    </div>
                    <div class="menu-icon" onclick="alert('Paramètres du thème')">
                        <span style="font-size:24px;">⚙️</span>
                        <span>Options</span>
                    </div>
                </div>

                <!-- Vue Liste des Médias (Bibliothèque avec Sélection de Groupe) -->
                <div id="media-list-view" style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #0b0f19; flex-direction: column; color: #fff; padding: 6px; z-index: 5;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #00f0ff33; padding-bottom: 3px;">
                        <span style="font-size: 10px; color: #00f0ff;">Bibliothèque</span>
                        <label style="background: #00f0ff; color: #000; font-size: 9px; padding: 2px 6px; border-radius: 3px; cursor: pointer;">
                            📁 Sélection Groupe <input type="file" id="multi-file-picker" accept="video/*,audio/*" multiple style="display:none;" onchange="addFiles(event)">
                        </label>
                    </div>
                    <div id="playlist-container" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;">
                        <div style="font-size: 9px; color: #777; text-align: center; margin-top: 20px;">Clique sur "Sélection Groupe" pour importer toute ta playlist d'un coup !</div>
                    </div>
                </div>

                <!-- Vue du Lecteur Multimédia & Égaliseur -->
                <div id="player-view" style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000; flex-direction: column; z-index: 10;">
                    <div style="position: relative; flex: 1; display: flex; justify-content: center; align-items: center; background: #000;">
                        <video id="video-element" controls autoplay onended="playNext()" style="width: 100%; height: 100%; object-fit: contain;"></video>
                        <!-- Canvas pour l'égaliseur audio -->
                        <canvas id="equalizer-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none;"></canvas>
                    </div>
                    <div style="background:#111; padding:4px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#00f0ff; font-size:10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;" id="now-playing">Aucun fichier</span>
                        <div class="file-input-wrapper">
                            <input type="file" id="file-picker" accept="video/*,audio/*" onchange="loadSingleFile(event)" style="font-size: 8px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pavé directionnel droit interactif -->
        <div class="right-nokia-pad">
            <div class="nav-key" onclick="goHome()" title="Accueil">🏠</div>
            <div class="nav-key" onclick="scrollPlaylist(-1)" title="Haut">▲</div>
            <div style="display:flex; width:100%; justify-content:space-around;">
                <div class="nav-key" onclick="playPrevious()" title="Précédent">◀</div>
                <div class="nav-key" style="background:#00f0ff; color:#000;" onclick="handleOKKey()" title="OK">OK</div>
                <div class="nav-key" onclick="playNext()" title="Suivant">▶</div>
            </div>
            <div class="nav-key" onclick="scrollPlaylist(1)" title="Bas">▼</div>
            <div class="nav-key" style="border-color: #ff3333; color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4);" onclick="goHome()" title="Quitter / Retour">📞</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-element');
        const playerView = document.getElementById('player-view');
        const homeMenu = document.getElementById('home-menu');
        const mediaListView = document.getElementById('media-list-view');
        const screenTitle = document.getElementById('screen-title');
        const nowPlaying = document.getElementById('now-playing');
        const playlistContainer = document.getElementById('playlist-container');
        const canvas = document.getElementById('equalizer-canvas');
        const ctx = canvas.getContext('2d');

        let playlist = [];
        let currentIndex = -1;
        let selectedIndex = 0; // Pour la navigation avec les flèches
        let audioCtx, analyser, sourceNode, isInitialized = false;

        function initAudioContext() {
            if (isInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                sourceNode = audioCtx.createMediaElementSource(videoElement);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                isInitialized = true;
                drawEqualizer();
            } catch (e) {
                console.log("AudioContext error:", e);
            }
        }

        function drawEqualizer() {
            requestAnimationFrame(drawEqualizer);
            if (!analyser || playerView.style.display !== 'flex') return;

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = (dataArray[i] / 255) * canvas.height;
                let gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#0055ff');
                gradient.addColorStop(1, '#00f0ff');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 2;
            }
        }

        function openPlayer() {
            homeMenu.style.display = 'none';
            mediaListView.style.display = 'none';
            playerView.style.display = 'flex';
            screenTitle.innerText = "VLC Media Player";
        }

        function openMediaList() {
            homeMenu.style.display = 'none';
            playerView.style.display = 'none';
            mediaListView.style.display = 'flex';
            screenTitle.innerText = "Nokia - Bibliothèque";
            renderPlaylist();
        }

        function goHome() {
            videoElement.pause();
            playerView.style.display = 'none';
            mediaListView.style.display = 'none';
            homeMenu.style.display = 'grid';
            screenTitle.innerText = "Nokia N95 - Menu";
        }

        // Sélection groupée de musiques et vidéos
        function addFiles(event) {
            const files = event.target.files;
            for (let file of files) {
                playlist.push({
                    name: file.name,
                    url: URL.createObjectURL(file),
                    type: file.type
                });
            }
            renderPlaylist();
            if (currentIndex === -1 && playlist.length > 0) {
                playMedia(0); // Lecture automatique du premier fichier importé
            }
        }

        function loadSingleFile(event) {
            const file = event.target.files[0];
            if (file) {
                playlist.push({ name: file.name, url: URL.createObjectURL(file), type: file.type });
                playMedia(playlist.length - 1);
            }
        }

        function renderPlaylist() {
            if (playlist.length === 0) {
                playlistContainer.innerHTML = `<div style="font-size: 9px; color: #777; text-align: center; margin-top: 20px;">Aucun média. Clique sur "Sélection Groupe" !</div>`;
                return;
            }
            playlistContainer.innerHTML = '';
            playlist.forEach((item, index) => {
                let div = document.createElement('div');
                let isSelected = (index === selectedIndex && mediaListView.style.display === 'flex');
                div.style.cssText = `padding: 5px; background: ${index === currentIndex ? 'rgba(0, 240, 255, 0.3)' : (isSelected ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)')}; border: 1px solid ${index === currentIndex || isSelected ? '#00f0ff' : 'rgba(0, 240, 255, 0.2)'}; border-radius: 4px; font-size: 9px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #fff;`;
                let icon = item.type.includes('audio') ? '🎵' : '🎬';
                div.innerHTML = `<span>${icon} ${item.name}</span>`;
                div.onclick = () => { selectedIndex = index; playMedia(index); };
                playlistContainer.appendChild(div);
            });
        }

        function playMedia(index) {
            if (playlist.length > 0 && index >= 0 && index < playlist.length) {
                currentIndex = index;
                selectedIndex = index;
                openPlayer();
                
                if (!isInitialized) initAudioContext();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

                videoElement.src = playlist[currentIndex].url;
                videoElement.play();
                nowPlaying.innerText = playlist[currentIndex].name;

                if (playlist[currentIndex].type.includes('audio')) {
                    canvas.style.display = 'block';
                } else {
                    canvas.style.display = 'none';
                }
            }
        }

        // Lecture automatique du suivant
        function playNext() {
            if (playlist.length > 0) {
                let nextIndex = (currentIndex + 1) % playlist.length;
                playMedia(nextIndex);
            }
        }

        function playPrevious() {
            if (playlist.length > 0) {
                let prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                playMedia(prevIndex);
            }
        }

        // Navigation dans la liste avec les touches Haut/Bas
        function scrollPlaylist(direction) {
            if (mediaListView.style.display === 'flex' && playlist.length > 0) {
                selectedIndex = (selectedIndex + direction + playlist.length) % playlist.length;
                renderPlaylist();
            }
        }

        // Action de la touche OK du pavé
        function handleOKKey() {
            if (mediaListView.style.display === 'flex' && playlist.length > 0) {
                playMedia(selectedIndex);
            } else {
                openMediaList();
            }
        }

        // Boutons de gauche
        document.getElementById('btn-play').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                if (videoElement.paused) videoElement.play();
                else videoElement.pause();
            } else if (playlist.length > 0) {
                playMedia(currentIndex >= 0 ? currentIndex : 0);
            } else {
                openMediaList();
            }
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                videoElement.pause();
                videoElement.currentTime = 0;
            }
        });

        // Service Worker PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
