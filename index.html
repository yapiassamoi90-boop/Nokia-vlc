<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia N95 VLC Player - Dev.Assamoi</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Signature */
        .signature {
            color: #00f0ff;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
        }

        /* Coque du Nokia N95 */
        .nokia-phone {
            width: 820px;
            height: 420px;
            background: linear-gradient(135deg, #222 0%, #111 50%, #000 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2), inset 0 -5px 15px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border: 3px solid #333;
            position: relative;
        }

        /* Boutons multimédias de gauche (Rétroéclairés bleu) */
        .left-media-keys {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0d0d0d;
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid #222;
        }

        .nokia-btn {
            width: 45px;
            height: 45px;
            background: #111;
            border: 1px solid #00f0ff;
            border-radius: 8px;
            color: #00f0ff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5), inset 0 0 5px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
        }

        .nokia-btn:hover, .nokia-btn:active {
            background-color: #00f0ff;
            color: #000;
            box-shadow: 0 0 20px #00f0ff, 0 0 35px #00f0ff;
            transform: scale(0.95);
        }

        /* Écran central simulant Symbian */
        .nokia-screen-container {
            width: 520px;
            height: 340px;
            background: #000;
            border: 4px solid #1a1a1a;
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen-header {
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            color: white;
            padding: 8px 15px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00f0ff33;
        }

        .screen-body {
            flex: 1;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Menus du téléphone */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            text-align: center;
        }

        .menu-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            padding: 15px 10px;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }

        .menu-icon:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .menu-icon span {
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }

        /* Lecteur vidéo / interface VLC cachée par défaut */
        #player-view {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
            flex-direction: column;
        }

        video {
            width: 100%;
            flex: 1;
            background: #000;
        }

        .file-input-wrapper {
            margin-top: 10px;
        }

        .file-input-wrapper input {
            font-size: 11px;
            color: #00f0ff;
        }

        /* Pavé de droite Nokia */
        .right-nokia-pad {
            width: 120px;
            height: 320px;
            background: #111;
            border-radius: 12px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .nav-key {
            width: 40px;
            height: 30px;
            background: #181818;
            border: 1px solid #00f0ff;
            border-radius: 5px;
            color: #00f0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
            cursor: pointer;
            font-size: 12px;
        }

        .nav-key:active {
            background: #00f0ff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="signature">DESIGNED BY DEV.ASSAMOI</div>

    <div class="nokia-phone">
        <!-- Touches multimédias lumineuses bleues à gauche -->
        <div class="left-media-keys">
            <button class="nokia-btn" id="btn-prev" title="Précédent">⏮</button>
            <button class="nokia-btn" id="btn-play" title="Lecture / Pause">⏯</button>
            <button class="nokia-btn" id="btn-stop" title="Arrêt">⏹</button>
            <button class="nokia-btn" id="btn-next" title="Suivant">⏭</button>
        </div>

        <!-- Écran principal -->
        <div class="nokia-screen-container">
            <div class="screen-header">
                <span id="screen-title">Nokia N95 - Menu</span>
                <span>📶 100% 🔋</span>
            </div>
            
            <div class="screen-body">
                <!-- Menu d'accueil -->
                <div class="menu-grid" id="home-menu">
                    <div class="menu-icon" onclick="openPlayer()">
                        <span style="font-size:24px;">📀</span>
                        <span>VLC Player</span>
                    </div>
                    <div class="menu-icon" onclick="alert('Galerie Vidéo')">
                        <span style="font-size:24px;">🎬</span>
                        <span>Vidéos</span>
                    </div>
                    <div class="menu-icon" onclick="alert('Paramètres du thème')">
                        <span style="font-size:24px;">⚙️️</span>
                        <span>Options</span>
                    </div>
                </div>

                <!-- Vue du Lecteur Vidéo type VLC -->
                <div id="player-view">
                    <video id="video-element" controls></video>
                    <div style="background:#111; padding:5px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#00f0ff; font-size:11px;" id="now-playing">Aucun fichier</span>
                        <div class="file-input-wrapper">
                            <input type="file" id="file-picker" accept="video/*" onchange="loadVideo(event)">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pavé directionnel droit -->
        <div class="right-nokia-pad">
            <div class="nav-key" onclick="goHome()">🏠</div>
            <div class="nav-key">▲</div>
            <div style="display:flex; width:100%; justify-content:space-around;">
                <div class="nav-key">◀</div>
                <div class="nav-key" style="background:#00f0ff; color:#000;">OK</div>
                <div class="nav-key">▶</div>
            </div>
            <div class="nav-key">▼</div>
            <div class="nav-key" style="border-color: #ff3333; color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4);">📞</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-element');
        const playerView = document.getElementById('player-view');
        const homeMenu = document.getElementById('home-menu');
        const screenTitle = document.getElementById('screen-title');
        const nowPlaying = document.getElementById('now-playing');

        function openPlayer() {
            homeMenu.style.display = 'none';
            playerView.style.display = 'flex';
            screenTitle.innerText = "VLC Media Player";
        }

        function goHome() {
            videoElement.pause();
            playerView.style.display = 'none';
            homeMenu.style.display = 'grid';
            screenTitle.innerText = "Nokia N95 - Menu";
        }

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoElement.src = fileURL;
                videoElement.play();
                nowPlaying.innerText = file.name;
            }
        }

        // Liaison des boutons lumineux bleus avec les actions du lecteur
        document.getElementById('btn-play').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                if (videoElement.paused) {
                    videoElement.play();
                } else {
                    videoElement.pause();
                }
            } else {
                openPlayer();
            }
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                videoElement.pause();
                videoElement.currentTime = 0;
            }
        });

        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker enregistré avec succès !', reg.scope);
                    })
                    .catch((err) => {
                        console.log('Erreur d\'enregistrement du Service Worker:', err);
                    });
            });
        }
    </script>
</body>
</html>
