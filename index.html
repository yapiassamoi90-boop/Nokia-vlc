<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia N95 VLC Player - Dev.Assamoi</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00f0ff">
</head>
<body>

    <div class="signature">DESIGNED BY DEV.ASSAMOI</div>

    <div class="nokia-phone">
        <!-- Touches multimédias lumineuses bleues à gauche -->
        <div class="left-media-keys">
            <button class="nokia-btn" id="btn-prev" title="Précédent">⏮</button>
            <button class="nokia-btn" id="btn-play" title="Lecture / Pause">⏯</button>
            <button class="nokia-btn" id="btn-stop" title="Arrêt">⏹</button>
            <button class="nokia-btn" id="btn-next" title="Suivant">⏭</button>
        </div>

        <!-- Écran principal -->
        <div class="nokia-screen-container">
            <div class="screen-header">
                <span id="screen-title">Nokia N95 - Menu</span>
                <span>📶 100% 🔋</span>
            </div>
            
            <div class="screen-body">
                <!-- Menu d'accueil -->
                <div class="menu-grid" id="home-menu">
                    <div class="menu-icon" onclick="openPlayer()">
                        <span style="font-size:24px;">📀</span>
                        <span>VLC Player</span>
                    </div>
                    <div class="menu-icon" onclick="alert('Galerie Vidéo')">
                        <span style="font-size:24px;">🎬</span>
                        <span>Vidéos</span>
                    </div>
                    <div class="menu-icon" onclick="alert('Paramètres du thème')">
                        <span style="font-size:24px;">⚙️</span>
                        <span>Options</span>
                    </div>
                </div>

                <!-- Vue du Lecteur Vidéo type VLC -->
                <div id="player-view">
                    <video id="video-element" controls></video>
                    <div style="background:#111; padding:5px; display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#00f0ff; font-size:11px;" id="now-playing">Aucun fichier</span>
                        <div class="file-input-wrapper">
                            <input type="file" id="file-picker" accept="video/*" onchange="loadVideo(event)">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pavé directionnel droit -->
        <div class="right-nokia-pad">
            <div class="nav-key" onclick="goHome()">🏠</div>
            <div class="nav-key">▲</div>
            <div style="display:flex; width:100%; justify-content:space-around;">
                <div class="nav-key">◀</div>
                <div class="nav-key" style="background:#00f0ff; color:#000;">OK</div>
                <div class="nav-key">▶</div>
            </div>
            <div class="nav-key">▼</div>
            <div class="nav-key" style="border-color: #ff3333; color: #ff3333; box-shadow: 0 0 8px rgba(255, 51, 51, 0.4);">📞</div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('video-element');
        const playerView = document.getElementById('player-view');
        const homeMenu = document.getElementById('home-menu');
        const screenTitle = document.getElementById('screen-title');
        const nowPlaying = document.getElementById('now-playing');

        function openPlayer() {
            homeMenu.style.display = 'none';
            playerView.style.display = 'flex';
            screenTitle.innerText = "VLC Media Player";
        }

        function goHome() {
            videoElement.pause();
            playerView.style.display = 'none';
            homeMenu.style.display = 'grid';
            screenTitle.innerText = "Nokia N95 - Menu";
        }

        function loadVideo(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoElement.src = fileURL;
                videoElement.play();
                nowPlaying.innerText = file.name;
            }
        }

        // Liaison des boutons lumineux bleus avec les actions du lecteur
        document.getElementById('btn-play').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                if (videoElement.paused) {
                    videoElement.play();
                } else {
                    videoElement.pause();
                }
            } else {
                openPlayer();
            }
        });

        document.getElementById('btn-stop').addEventListener('click', () => {
            if (playerView.style.display === 'flex') {
                videoElement.pause();
                videoElement.currentTime = 0;
            }
        });

        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        console.log('Service Worker enregistré avec succès !', reg.scope);
                    })
                    .catch((err) => {
                        console.log('Erreur d\'enregistrement du Service Worker:', err);
                    });
            });
        }
    </script>
</body>
</html>
